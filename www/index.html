function vqz(pool,n,own){const L=LV[lvl],K=L.dir==0?[0,2,3,5]:L.dir==1?[1,2,3,4]:[0,1,2,3,4];
 let w=sh(pool);if(own)w.sort((x,y)=>own.includes(y)-own.includes(x));
 w=w.filter((x,j)=>w.findIndex(y=>y[0]==x[0])==j);const B=w.length;return Array.from({length:n},(_,j)=>mkv(w[j%B],K[(j+Math.floor(j/B))%K.length]))}
